workflows:
  android-workflow:
    name: Reminda Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up local.properties and environment
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          touch .env
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Flutter Analyzer & Tests
        script: |
          flutter analyze
          flutter test
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - alfiepolacas23@gmail.com
        notify:
          success: true
          failure: true

  windows-workflow:
    name: Reminda Windows Release Build
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable
      # API keys injected at compile time — never stored in a .env file
      # that would ship alongside the Windows executable.
      groups:
        - reminda_secrets  # Codemagic env group containing GEMINI_API_KEY, GROQ_API_KEY
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Run Flutter Analyzer & Tests
        script: |
          flutter analyze
          flutter test
      - name: Build Windows Release (keys baked in at compile time)
        script: |
          flutter build windows --release --no-tree-shake-icons `
            --dart-define=GEMINI_API_KEY=$env:GEMINI_API_KEY `
            --dart-define=GROQ_API_KEY=$env:GROQ_API_KEY
    artifacts:
      - build\windows\x64\runner\Release\**
    publishing:
      email:
        recipients:
          - alfiepolacas23@gmail.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: Reminda iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up environment
        script: |
          touch .env
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Run Flutter Analyzer & Tests
        script: |
          flutter analyze
          flutter test
      - name: Build iOS Application Payload (xcodebuild unsigned)
        script: |
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build/ios \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     clean build
      - name: Package iOS Release IPA
        script: |
          mkdir -p build/ios/Payload
          mkdir -p build/ios/ipa
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -r "$CM_BUILD_DIR/build/ios/ipa/Reminda.ipa" Payload
          cd "$CM_BUILD_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - alfiepolacas23@gmail.com
        notify:
          success: true
          failure: true
